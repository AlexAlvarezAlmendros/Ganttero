server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# La API vive en el backend; el trailing slash recorta el prefijo /api
	# (mismo contrato que el proxy de Vite en dev).
	location /api/ {
		proxy_pass http://backend:3000/;
		proxy_set_header Host $host;
		client_max_body_size 30m; # audios de voz

		# La IA local (Ollama/Gemma) genera por CPU y puede tardar minutos;
		# el default de nginx (60s) provoca 504 en "mejorar texto" y STT.
		proxy_connect_timeout 30s;
		proxy_send_timeout 300s;
		proxy_read_timeout 300s;
	}

	# SPA: cualquier ruta cae en index.html
	location / {
		try_files $uri /index.html;
	}
}
