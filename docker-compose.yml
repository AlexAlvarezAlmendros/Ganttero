# Ganttero en el homeserver. Datos (DB + audios) en el NAS vía
# GANTTERO_DATA_DIR. Ollama corre aparte en el propio homeserver.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Manda sobre el `.env` (que puede venir copiado del ejemplo con
      # NODE_ENV=development): en el homeserver la auth es obligatoria.
      NODE_ENV: production
      DATABASE_URL: file:/data/ganttero.db
      AUDIO_DIR: /data/audios
      STT_PYTHON: /app/stt/.venv/bin/python
      STT_SCRIPT: /app/stt/stt.py
    volumes:
      - ${GANTTERO_DATA_DIR:-./data}:/data
    # LAN only: el puerto del backend no se publica; entra por el frontend.

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${GANTTERO_PORT:-8080}:80"
    depends_on:
      - backend
